<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Las Gidi Collection — Ifueko</title>
  <meta name="description" content="Las Gidi by Ifueko: couture for the restless Lagos woman who shapes the world to fit her vision.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@400;700&family=Jost:wght@300;400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="looks.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body class="theme-light">

  <header class="site-header">
    <a class="site-header__wordmark" href="index.html">IFUEKO</a>

    <nav class="site-nav" aria-label="Main">
      <a class="caps-link" href="collection.html" aria-current="page">Collection</a>
      <a class="caps-link" href="artist.html">The Artist</a>
      <!-- Bag does nothing yet -->
      <button class="caps-link" type="button" aria-label="Bag, 0 items">Bag (0)</button>
    </nav>
  </header>

  <main>
    <div class="collection-intro">
      <h1 class="page-title">LAS GIDI COLLECTION</h1>
      <p class="meta-caps" data-look-count></p>
    </div>

    <!-- Filled in by app.js from looks.js -->
    <ul class="look-grid" data-collection-grid aria-label="Looks in the Las Gidi Collection"></ul>
  </main>

  <footer class="site-footer">
    <span>© 2026 Ifueko</span>
    <div class="site-footer__links">
      <a class="caps-link" href="https://www.instagram.com/artobosa/">Instagram</a>
      <!-- TODO: add your email address after mailto: -->
      <a class="caps-link" href="mailto:">Email</a>
    </div>
  </footer>

  <!-- The card used for each look in the grid -->
  <template id="look-card-template">
    <li>
      <a class="look-card" href="collection.html">
        <img class="look-card__image" alt="" loading="lazy">
        <span class="look-card__caption">
          <span class="look-card__name"></span>
          <span class="look-card__price"></span>
        </span>
      </a>
    </li>
  </template>

</body>
</html>
